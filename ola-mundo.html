<!-- DOCTYPE - serve para indicar para os navegadores qual a versão e qual o padrão de html está sendo usado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertence ao documento HTML fica dentro dele -->

<!-- LANG/language (idioma) = Atrubito responsavel pela linguagem de conteudo do site. Além disso, tem um impacto muito grande na acessibilidade e SEO -->
<html lang="pt-br">


<head>

    <!--charset = essa configuracão serve para indicar ao navegador qual padrão/codificacao de caracteres usar
    isso permite utilizar palavras com acentos, caracteres especiais e emojis   -->
    <meta charset="UTF-8">
    <!-- serve pra ajustar a largura de site com o dispositivo automaticamente -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/titulo = Representa o título que aparece na aba do navegador para o usuario. -->
    <title> Olá pessoas </title>
</head>

<!-- body/corpo do site - conteudo visivel do documento onde o usuario interaje e consome e recursos da pagina. Por exemplo titulos, paragrafos, imagens, videos, formularios e etc. -->

<body>
    Olá mundo, este é o meu primeiro programa em HTML.
</body>

</html>
